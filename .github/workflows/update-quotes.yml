name: Update quotes

on:
  schedule:
    - cron: "2,17,32,47 * * * *"   # every 15 minutes (GitHub may start scheduled runs late)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-quotes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch quotes (Yahoo Finance chart API, no key) -> data/quotes.json
        run: python3 tools/update_quotes.py
      - name: Commit only if prices changed
        run: |
          git config user.name "marketplus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quotes.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update quotes $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
