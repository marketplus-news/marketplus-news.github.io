name: Update news feed

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data/news.json
        run: python3 tools/build_news.py
      - name: Commit if changed
        run: |
          git config user.name "marketplus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/posts.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update news feed $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
